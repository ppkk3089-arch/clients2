<html lang="ru" data-app="lidoradar">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Лидорадар</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: быстрый, технологичный — «прибор», который ловит клиентов
   IDEA: экран радара: каждая карточка — засечка с уровнем сигнала
   PICTURE: зелёно-бирюзовый радар с кольцами и засечками в шапке
   COLOUR and TYPE: глубокий бирюзовый, коралловый сигнал; Unbounded + Manrope
   LAYOUT: шапка-радар, липкая панель фильтров, лента карточек с полосой сигнала */
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:var(--maxw,680px);margin:0 auto;padding:0 max(4vw,14px)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats b{display:block;font-size:26px;line-height:1.1}
.stats span{font-size:13px}
#tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
#tabs button{min-height:42px;font-weight:700;font-size:14px;border:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips button{flex:none;min-height:36px;padding:0 13px;font-size:14px;font-weight:600;white-space:nowrap}
.chips i{font-style:normal;opacity:.6;font-weight:500}
#q{width:100%;min-height:44px;font:16px inherit;padding:0 14px;margin-top:8px}
.count{font-size:13px;margin:14px 0 8px}
.card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;margin-bottom:12px}
.name{margin:0;font-size:18px;line-height:1.2}
.meta{margin:3px 0 0;font-size:13px}
.why{display:flex;flex-wrap:wrap;gap:5px;list-style:none;padding:0;margin:10px 0 0}
.why li{font-size:12.5px;font-weight:600;padding:3px 8px}
.nums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin:8px 0 0;word-break:break-all}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.acts a{flex:1 1 30%;min-height:42px;display:flex;align-items:center;justify-content:center;text-decoration:none;font-weight:700;font-size:14px;text-align:center}
details{margin-top:10px}summary{cursor:pointer;font-weight:700;font-size:14px;min-height:36px;display:flex;align-items:center}
.msg{white-space:pre-wrap;font-size:14.5px;padding:12px;margin:4px 0 8px}
.copy{width:100%;min-height:44px;border:0;font-weight:700}
.st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-top:10px}
.st button{min-height:40px;font-size:13px;font-weight:700}
.empty{text-align:center;padding:40px 10px}.empty b{display:block;font-size:19px;margin-bottom:4px}
.note{font-size:12px;text-align:center;margin:20px 0 40px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:10px 16px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


:root{color-scheme:light dark;--bg:light-dark(#eef4f3,#081214);--ink:light-dark(#0b1d20,#e6f2f1);--mute:light-dark(#5a7174,#8fa9ac);--card:light-dark(#fff,#0f1f22);--line:light-dark(#d5e3e1,#1c3236);--teal:#0b5f66;--acc:#ff6b4a;--chip:light-dark(#e2eeec,#14292d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body{font:16px/1.5 Manrope,system-ui,sans-serif}
.hero{background:var(--teal);color:#e9fbf9;position:relative;overflow:hidden;padding:26px 0 20px}
.hero svg{position:absolute;right:-60px;top:-50px;width:300px;height:300px;opacity:.9}
.hero h1{font:800 34px/1.05 Unbounded,sans-serif;margin:0;letter-spacing:-.01em}
.hero p{margin:6px 0 18px;opacity:.85;font-size:14px}
.sweep{transform-origin:150px 150px;animation:spin 6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.stats div{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:9px 11px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 6px;border-bottom:1px solid var(--line)}
#tabs{background:var(--chip);border-radius:12px;padding:3px}#tabs button{background:none;border-radius:9px}
#tabs button[aria-pressed=true]{background:var(--teal);color:#fff}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:99px}
.chips button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);background:light-dark(#fff3ef,#2a1612)}
#q{background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
.count,.meta,.nums,.note,.empty{color:var(--mute)}
.card{background:var(--card);border-radius:16px;padding:14px 14px 14px 0;border:1px solid var(--line)}
.score{width:62px;display:flex;flex-direction:column;align-items:center;border-right:4px solid var(--sig);gap:2px;padding-top:2px}
.card[data-heat=hot]{--sig:var(--acc)}.card[data-heat=warm]{--sig:#e9a23b}.card[data-heat=mild]{--sig:var(--mute)}
.score b{font:800 24px/1 Unbounded,sans-serif;color:var(--sig)}.score small{font-size:11px;color:var(--mute)}
.name{font-weight:800}
.why li{background:var(--chip);border-radius:7px}
.acts a{background:var(--chip);color:var(--ink);border-radius:10px}.acts a:first-child{background:var(--teal);color:#fff}
.msg{background:var(--chip);border-radius:10px}.copy{background:var(--ink);color:var(--bg);border-radius:10px}
.st button{background:none;border:1px solid var(--line);border-radius:9px}
.st button[aria-pressed=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.st button[data-s=deal][aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
.toast{background:var(--teal);color:#fff;border-radius:12px}
</style></head>

  if(+l.reviews>=10)r.push(`${l.reviews} ${pl(l.reviews,'отзыв','отзыва','отзывов')}`+(+l.reviews>=150?' — поток клиентов':''));
  const b=branches(l);if(b)r.push(b);if(l.vk&&!l.site)r.push('живёт во ВКонтакте');if(l.tg||l.wa)r.push('есть мессенджер');return r}
function text(l){const s=short(l),b=branches(l);const fact=`рейтинг ${num(l.rating)} и ${l.reviews} ${pl(l.reviews,'отзыв','отзыва','отзывов')}${b?', '+b:''}`;const tap=l.site?` (только ${l.site})`:'';const hi='Здравствуйте! Меня зовут Максим, делаю сайты и Telegram-ботов';
  switch(l.niche){
  case 'Цветочные':return `${hi} для цветочных. Посмотрел «${s}» в 2ГИС: ${fact}, но своего сайта не нашёл${tap}.\n\nНедавно сделал бота-витрину для цветочного салона: клиент листает готовые букеты с ценами, выбирает дату, время, адрес и открытку и сразу бронирует, а заказ приходит флористам в чат. Могу сделать такого под вас или сайт-каталог.\n\nПокажу бесплатный пример на ваших букетах. Интересно?`;
  case 'Стоматологии':return `${hi} для клиник. У «${s}» ${fact}, но сайта клиники я не нашёл${tap}, а стоматологию почти всегда сначала ищут в Яндексе и сравнивают цены и врачей.\n\nМогу сделать сайт с услугами, ценами, врачами и онлайн-записью, плюс Telegram-бота для записи и напоминаний о приёме, чтобы меньше пациентов пропускали визиты.\n\nСделаю бесплатный макет. Интересно?`;
  case 'Бары':return `${hi} для баров. У «${s}» ${fact}, а своего сайта я не нашёл${tap}.\n\nМогу сделать Telegram-бота для брони столов: гость выбирает дату, время и количество человек, а бронь сразу приходит администратору. В том же боте — меню, афиша вечеринок и рассылка постоянным гостям. И сайт с меню и бронью, чтобы вас находили в Яндексе.\n\nСделаю бесплатный пример. Интересно?`;
  case 'Тату-салоны':return `${hi} для тату-студий. У «${s}» ${fact}, а сайта-портфолио я не нашёл${tap} — новые клиенты выбирают мастера по работам, и им негде их посмотреть вне соцсетей.\n\nМогу сделать сайт с работами мастеров, ценами и онлайн-записью и Telegram-бота: клиент присылает идею эскиза и размер, выбирает мастера и дату, а бот напоминает о сеансе.\n\nСделаю бесплатный пример на ваших работах. Интересно?`;
  case 'Брендовая одежда':return `${hi} для магазинов одежды. У «${s}» ${fact}, а каталога в интернете я не нашёл${tap} — покупателю не узнать заранее, есть ли нужная вещь и размер.\n\nМогу сделать Telegram-бота-каталог: новые поступления с фото, размерами и ценами, бронь вещи на примерку и рассылка о новинках постоянным покупателям. Или сайт-каталог для Яндекса.\n\nСделаю бесплатный пример на 10–15 ваших вещах. Интересно?`;
  default:return `${hi}. У «${s}» ${fact}, а своего сайта я не нашёл${tap}. Могу сделать сайт или Telegram-бота под ваш бизнес — покажу бесплатный пример. Интересно?`}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1700)}
const sOf=l=>(st[l.id]&&st[l.id].s)||'new';
function card(l){const s=sOf(l),t=text(l),ph=phoneRaw(l.phone),wa=l.wa?`https://wa.me/${l.wa}?text=${encodeURIComponent(t)}`:'';
  const acts=[[ph?'tel:'+ph:'','Позвонить'],[wa,'WhatsApp'],[l.tg,'Telegram'],[l.vk,'ВКонтакте'],[l.gis,'2ГИС']].filter(a=>a[0]);
  return `<article class="card" data-id="${esc(l.id)}" data-heat="${l.score>=85?'hot':l.score>=75?'warm':'mild'}">
  <div class="score"><b>${+l.score}</b><small>балл</small></div>
  <div class="body">
   <h2 class="name">${esc(l.name)}</h2>
   <p class="meta">${esc(l.niche)} · ${esc(l.city)}${l.address?' · '+esc(l.address):''}</p>
   <ul class="why">${reasons(l).map(r=>`<li>${esc(r)}</li>`).join('')}</ul>
   <p class="nums">${ph?`<span>☎ ${esc(ph)}</span>`:''}${l.wa?`<span>WA +${esc(l.wa)}</span>`:''}${l.email?`<span>${esc(l.email)}</span>`:''}</p>
   <div class="acts">${acts.map(a=>`<a href="${esc(a[0])}" target="_blank" rel="noopener">${a[1]}</a>`).join('')}</div>
   <details><summary>Первое сообщение</summary><div class="msg">${esc(t)}</div><button class="copy" data-copy>Скопировать текст</button></details>
   <div class="st">${Object.keys(ST).map(k=>`<button data-s="${k}" aria-pressed="${s===k}">${ST[k]}</button>`).join('')}</div>
  </div></article>`}
function chips(el,items,cur,set){el.innerHTML=items.map(x=>`<button data-v="${esc(x)}" aria-pressed="${x===cur}">${esc(x)}${x==='Все'?'':` <i>${leads.filter(l=>(set==='c'?l.city:l.niche)===x).length}</i>`}</button>`).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(set==='c')city=b.dataset.v;else niche=b.dataset.v;saveUi();render()}}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===tab));
  const cities=['Все',...new Set(leads.map(l=>l.city))],niches=['Все',...new Set(leads.map(l=>l.niche))];
  if(!cities.includes(city))city='Все';if(!niches.includes(niche))niche='Все';
  chips($('#cities'),cities,city,'c');chips($('#niches'),niches,niche,'n');
  $('#sAll').textContent=leads.length;$('#sWork').textContent=leads.filter(l=>['wrote','replied'].includes(sOf(l))).length;$('#sDeal').textContent=leads.filter(l=>sOf(l)==='deal').length;
  const v=leads.filter(l=>{const s=sOf(l);if(tab==='new'&&s!=='new')return false;if(tab==='work'&&!['wrote','replied','deal'].includes(s))return false;if(tab==='no'&&s!=='no')return false;
    if(city!=='Все'&&l.city!==city)return false;if(niche!=='Все'&&l.niche!==niche)return false;if(q&&!(l.name+' '+l.address).toLowerCase().includes(q))return false;return true}).sort((a,b)=>b.score-a.score||b.reviews-a.reviews);
  $('#count').textContent=`${v.length} ${pl(v.length,'клиент','клиента','клиентов')}`;
  $('#list').innerHTML=v.length?v.map(card).join(''):`<p class="empty"><b>${leads.length?'Здесь пусто':'Загружаю клиентов…'}</b>${leads.length?'Смените вкладку или фильтр.':''}</p>`}
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;saveUi();render()};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};
$('#list').onclick=async e=>{const c=e.target.closest('.card');if(!c)return;const l=leads.find(x=>x.id===c.dataset.id);if(!l)return;
  if(e.target.closest('[data-copy]')){try{await navigator.clipboard.writeText(text(l));toast('Текст скопирован')}catch(er){toast('Выделите текст и скопируйте вручную')}return}
  const b=e.target.closest('[data-s]');if(!b)return;const prev=st[l.id];const ns=sOf(l)===b.dataset.s?'new':b.dataset.s;
  if(busy[l.id])return;busy[l.id]=1;st[l.id]={s:ns,at:Date.now()};render();
  try{localStorage.setItem(KEY+':st',JSON.stringify(st));toast(ns==='new'?'Вернул в новые':'Отмечено: '+ST[ns])}catch(er){st[l.id]=prev;render();toast('Не сохранилось, попробуйте ещё раз')}finally{busy[l.id]=0}};
render();
Promise.resolve(window.LEADS_DATA).then(d=>{leads=d.map(r=>({id:r[0],name:r[1],niche:r[2],city:r[3],address:r[4],rating:r[5],reviews:r[6],branches:r[7],score:r[8],site:r[9],phone:r[10],wa:r[11],tg:r[12],email:r[13],vk:r[14],gis:`https://2gis.ru/${r[15]}/firm/${r[0]}`}));render()}).catch(()=>{$('#list').innerHTML='<p class="empty"><b>Не удалось загрузить список</b>Обновите страницу.</p>'});
try{st=JSON.parse(localStorage.getItem(KEY+':st')||'{}')}catch(e){st={}}render();
}

</script>
</body></html>
